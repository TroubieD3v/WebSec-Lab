# Dashboard origin (:3000): static UI + reverse proxy to the control-plane API.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 128k;
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:8081 http://localhost:8081; connect-src 'self'; frame-src http://127.0.0.1:8081 http://localhost:8081; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}

# Lab origin (:8081): a different origin from the dashboard, so XSS demonstrated in the
# sandboxed iframe can never touch the dashboard. Only the two XSS pages the iframe
# needs (plus their script and beacon) and uploaded files for preview are exposed; status/source/reset and the other
# labs stay on the internal network. Data for Stored XSS is written through the API proxy.
server {
    listen 8081;
    server_name _;
    server_tokens off;

    location ~ ^/(xss/(static/lab\.js|(vulnerable|fixed)/(search|beacon))|stored-xss/(static/lab\.js|(vulnerable|fixed)/(page|beacon))|file-upload/(vulnerable|fixed)/uploads/[A-Za-z0-9._-]+)$ {
        proxy_pass http://labs:8081;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
