# Weekly, grouped dependency updates. Python pins live in requirements*.txt compiled from
# requirements*.in with pip-tools; Dependabot understands that layout and updates both.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/labs", "/backend"]
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/frontend", "/tests/e2e"]
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/labs", "/backend", "/frontend"]
    schedule: { interval: weekly }
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Stay on the Node.js LTS line: odd majors never become LTS, and version ranges do not match
      # tags like "25-alpine", so majors are moved by hand when the next LTS is out. Minor/patch still flow.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
