name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Backend and lab security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            labs/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r labs/requirements.txt
      - run: ruff check
      - run: pytest

  service-requirements:
    name: ${{ matrix.service }} starts with only its own requirements
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: labs
            check: "import main; assert len(main.MODULES) == 12"
          - service: backend
            check: "from app.main import create_app; create_app()"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Docker image's dependencies into a clean environment
        run: pip install -r ${{ matrix.service }}/requirements.txt
      - name: Import the service
        working-directory: ${{ matrix.service }}
        env:
          PROGRESS_DB: ${{ runner.temp }}/progress.db
        run: python -c "${{ matrix.check }}"

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    needs: [python-tests, service-requirements, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build --detach --wait
      - name: Smoke test (every lab verifies against both modes)
        run: python3 tests/smoke.py http://127.0.0.1:3000
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: tests/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
